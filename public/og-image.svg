<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; }
      .mono { font-family: "Courier New", monospace; font-weight: 800; }
    </style>
  </defs>

  <!-- Cream Canvas Background -->
  <rect x="0" y="0" width="1200" height="630" fill="#FAF6ED"/>

  <!-- Outer Neo-brutalist Double Border -->
  <rect x="24" y="24" width="1152" height="582" fill="#FFFFFF" stroke="#1E1E1E" stroke-width="8"/>
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="#E53926" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Top Decorative Header Bar -->
  <rect x="36" y="36" width="1128" height="48" fill="#1E1E1E"/>
  <text x="60" y="68" class="mono" font-size="18" fill="#FFD54F" letter-spacing="2">OFFICIAL TOURNAMENT EDITION &bull; SIMULATION PLATFORM</text>
  <text x="1130" y="68" class="mono" font-size="18" fill="#FFFFFF" text-anchor="end">2026</text>

  <!-- Left Content Column -->
  <!-- Main Brand Title -->
  <text x="80" y="190" class="title" font-size="94" fill="#111111" letter-spacing="-2">SAMARG <tspan fill="#E53926">XI</tspan></text>
  
  <!-- Tagline Banner -->
  <rect x="80" y="220" width="620" height="44" fill="#C89B3C" stroke="#1E1E1E" stroke-width="3"/>
  <text x="96" y="250" class="title" font-size="22" fill="#111111" letter-spacing="2">CRICKET DRAFT &amp; WORLD CUP SIMULATOR</text>

  <!-- Descriptive Pitch Copy -->
  <text x="80" y="315" class="title" font-size="24" fill="#333333">Assemble legendary squads from authentic World Cup history.</text>
  <text x="80" y="350" class="title" font-size="24" fill="#333333">Simulate hyper-realistic ball-by-ball tournament matches.</text>
  <text x="80" y="385" class="title" font-size="24" fill="#333333">Compete live in 1v1 multiplayer draft rooms or solo campaign.</text>

  <!-- Feature Pills -->
  <g transform="translate(80, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="52" fill="#FAF6ED" stroke="#1E1E1E" stroke-width="3"/>
    <text x="95" y="33" class="title" font-size="16" fill="#111111" text-anchor="middle">⚡ 100% FREE TO PLAY</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="220" height="52" fill="#FAF6ED" stroke="#1E1E1E" stroke-width="3"/>
    <text x="320" y="33" class="title" font-size="16" fill="#111111" text-anchor="middle">🏏 BALL-BY-BALL ENGINE</text>

    <!-- Pill 3 -->
    <rect x="450" y="0" width="210" height="52" fill="#FAF6ED" stroke="#1E1E1E" stroke-width="3"/>
    <text x="555" y="33" class="title" font-size="16" fill="#111111" text-anchor="middle">👥 LIVE MULTIPLAYER</text>
  </g>

  <!-- Right Side Graphic: Pitch & Stadium Illustration -->
  <g transform="translate(760, 130)">
    <!-- Pitch Board Container -->
    <rect x="0" y="0" width="370" height="420" fill="#2E7D32" stroke="#1E1E1E" stroke-width="6" rx="16"/>
    <!-- Pitch Infield Cut -->
    <rect x="30" y="30" width="310" height="360" fill="#388E3C" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4" rx="8"/>
    <!-- 22 Yard Strip -->
    <rect x="135" y="50" width="100" height="320" fill="#EFEBE4" stroke="#1E1E1E" stroke-width="3"/>
    <!-- Bowling Crease Lines -->
    <line x1="135" y1="90" x2="235" y2="90" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="135" y1="330" x2="235" y2="330" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Stumps -->
    <circle cx="170" cy="85" r="4" fill="#C89B3C"/>
    <circle cx="185" cy="85" r="4" fill="#C89B3C"/>
    <circle cx="200" cy="85" r="4" fill="#C89B3C"/>
    <circle cx="170" cy="335" r="4" fill="#C89B3C"/>
    <circle cx="185" cy="335" r="4" fill="#C89B3C"/>
    <circle cx="200" cy="335" r="4" fill="#C89B3C"/>

    <!-- Ball Trajectory Arc -->
    <path d="M 185,90 Q 230,210 185,320" fill="none" stroke="#E53926" stroke-width="5" stroke-dasharray="8 6"/>
    <!-- Cricket Ball -->
    <circle cx="185" cy="315" r="12" fill="#E53926" stroke="#1E1E1E" stroke-width="3"/>
    <line x1="177" y1="315" x2="193" y2="315" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2"/>

    <!-- Floating Badge -->
    <rect x="85" y="365" width="200" height="40" fill="#E53926" stroke="#1E1E1E" stroke-width="3"/>
    <text x="185" y="391" class="title" font-size="15" fill="#FFFFFF" font-weight="900" text-anchor="middle">LIVE DRAFT ROSTER</text>
  </g>

  <!-- Bottom URL Bar -->
  <text x="80" y="545" class="mono" font-size="18" fill="#666666" letter-spacing="1">HTTPS://SAMARG-7BE68.WEB.APP</text>
</svg>
