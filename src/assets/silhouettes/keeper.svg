  <circle cx="60" cy="40" r="9" fill="currentColor" opacity="0.85" />
  <!-- Crouching Body -->
  <path d="M45 52 h30 c2 0 4 2 4 4 l-6 25 h-16 l-12-25 c0-2 2-4 4-4 z" fill="currentColor" opacity="0.85" />
  <!-- Keeper Gloves (Hands extended forward) -->
  <circle cx="85" cy="62" r="5" fill="var(--accent-gold)" />
  <circle cx="85" cy="70" r="5" fill="var(--accent-gold)" />
  <!-- Crouching legs -->
  <path d="M45 81 l-12 25 h8 l12-25 Z" fill="currentColor" opacity="0.85" />
  <path d="M67 81 l12 25 h8 l-12-25 Z" fill="currentColor" opacity="0.85" />
  <!-- Stumps behind -->
  <rect x="25" y="60" width="3" height="46" fill="var(--willow-tan)" opacity="0.4" />
  <rect x="31" y="60" width="3" height="46" fill="var(--willow-tan)" opacity="0.4" />
  <rect x="37" y="60" width="3" height="46" fill="var(--willow-tan)" opacity="0.4" />
  <rect x="23" y="57" width="18" height="3" fill="var(--willow-tan)" opacity="0.4" />
</svg>
