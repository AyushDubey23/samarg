<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMARG — Cricket Draft & World Cup Simulator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect x='16' y='16' width='480' height='480' fill='%23FAF6ED' stroke='%231E1E1E' stroke-width='24'/%3E%3Crect x='36' y='36' width='440' height='440' fill='none' stroke='%23E53926' stroke-width='6'/%3E%3Ctext x='256' y='240' font-family='sans-serif' font-size='110' font-weight='900' letter-spacing='-2' text-anchor='middle'%3E%3Ctspan fill='%23111111'%3ESAMARG %3C/tspan%3E%3Ctspan fill='%23E53926'%3EXI%3C/tspan%3E%3C/text%3E%3Ctext x='256' y='330' font-family='sans-serif' font-size='46' font-weight='900' letter-spacing='1' fill='%23333333' text-anchor='middle'%3ECRICKET DRAFT%3C/text%3E%3Cpath d='M 70,400 Q 256,450 442,400' fill='none' stroke='%23E53926' stroke-width='12' stroke-linecap='round'/%3E%3Cpath d='M 70,400 Q 256,450 442,400' fill='none' stroke='%23111111' stroke-width='3' stroke-dasharray='8 8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="alternate icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="shortcut icon" href="./favicon.svg">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/draft.css">
  <link rel="stylesheet" href="./styles/match.css">
  <link rel="stylesheet" href="./styles/pitch.css">
  <link rel="stylesheet" href="./styles/leaderboard.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>

  <!-- Top App Header -->
  <header id="app-header">
    <a href="#/" id="logo" style="cursor: pointer; text-decoration: none; color: inherit;">
      SAMARG <span>XI</span>
      <div id="logo-sub">Cricket Draft & WC Sim</div>
    </a>
    <nav class="nav-links">
      <a href="#/" class="nav-link">Home</a>
      <a href="#/leaderboard" class="nav-link">Leaderboard</a>
      <button id="share-game-btn" class="btn btn-secondary btn-sm" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">Share 🔗</button>
      <a href="#/draft" id="draft-nav-btn" class="btn btn-accent btn-sm" style="padding: 0.4rem 1rem; font-size: 0.85rem;">Scout XI</a>
      <div id="auth-status-container">
        <!-- Will be filled by Auth state -->
        <span style="font-size: 0.85rem; color: var(--chalk-white-dim);">Connecting...</span>
      </div>
    </nav>
  </header>



  <!-- Main Single Page View Container -->
  <main id="app-viewport">
    <div class="text-center" style="margin-top: 10vh;">
      <h2 style="font-size: 2rem;">Loading SAMARG...</h2>
      <p style="color: var(--chalk-white-dim); margin-top: 1rem;">Setting up simulation parameters</p>
    </div>
  </main>

  <!-- Footer -->
  <footer id="app-footer">
    <div class="footer-content">
      <p>&copy; 2026 SAMARG Cricket. Built for ultimate realistic simulation.</p>
    </div>
  </footer>

  <!-- Toasts for warnings/success -->
  <div id="toast-container"></div>

  <!-- Entry Script -->
  <script type="module" src="./scripts/router.js"></script>
</body>
</html>
