<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Cream Box -->
  <rect x="16" y="16" width="480" height="480" fill="#FAF6ED" stroke="#1E1E1E" stroke-width="24"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#E53926" stroke-width="6"/>

  <!-- SAMARG XI Brand Text -->
  <text x="256" y="240" font-family="'Outfit', 'Impact', sans-serif" font-size="110" font-weight="900" letter-spacing="-2" text-anchor="middle">
    <tspan fill="#111111">SAMARG </tspan>
    <tspan fill="#E53926">XI</tspan>
  </text>

  <!-- Subtitle Text -->
  <text x="256" y="330" font-family="'Outfit', sans-serif" font-size="46" font-weight="900" letter-spacing="1" fill="#333333" text-anchor="middle">
    CRICKET DRAFT
  </text>

  <!-- Decorative Cricket Seam Curve -->
  <path d="M 70,400 Q 256,450 442,400" fill="none" stroke="#E53926" stroke-width="12" stroke-linecap="round"/>
  <path d="M 70,400 Q 256,450 442,400" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round"/>
</svg>
